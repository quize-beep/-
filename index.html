    let currentQuestionIndex = 0;
    let userAnswers = [];
    let score = 0;

    const examContainer = document.getElementById('exam-container');

    function renderQuestion() {
        if (currentQuestionIndex >= examData.length) {
            renderResults();
            return;
        }

        const questionData = examData[currentQuestionIndex];
        const { question, options, type } = questionData;
        const isAnswered = userAnswers[currentQuestionIndex] !== undefined;
        const userAnswer = userAnswers[currentQuestionIndex];

        let optionsHtml = '';
        options.forEach((option, index) => {
            let classes = 'option';
            if (isAnswered) {
                if (index === questionData.answer) {
                    classes += ' correct';
                } else if (index === userAnswer) {
                    classes += ' incorrect';
                }
            }
            optionsHtml += `<div class="${classes}" data-index="${index}">${option}</div>`;
        });

        let navigationHtml = `
            <div class="navigation-buttons mt-4">
                <button class="btn btn-secondary" onclick="prevQuestion()" ${currentQuestionIndex === 0 ? 'disabled' : ''}>السابق</button>
                <button class="btn btn-primary" id="next-btn" ${isAnswered ? '' : 'disabled'}>${currentQuestionIndex === examData.length - 1 ? 'النتائج' : 'التالي'}</button>
            </div>
        `;

        if (type === "passage") {
            const passageText = "ربما كانت فضيلة الإحسان من أكثر الفضائل تقلبا مع الزمان، وتغيرا في أفهام الناس، فكم بين ما كان يفهمه حاتم الطائي من نحر الجزور وإنهابها الناس، وبين ما وضع من النظم الحديثة للإحسان من فروق ومباينات فنظام المعيشة من قديم ينتج غنيا مفرط الغنى، وفقيرا مفرط الفقر، ولم يُخلق للآن نظام يعدم هذه الفروق أو يقللها من غير أن يستتبع خطرًا أعظم وداء أعضل، فاهتدى الناس لتلطيف هذه الفروق إلى المناداة بالكرم والفخر به، ولست أدري أكان أول من نادى به الأغنياء اتقاء لخطر الفقراء، أم الفقراء تعطيفًا لقلوب الأغنياء. وأتت الأديان تدعو إلى الأخوة، وخاصة بين أهل الدين الواحد، وتجعل من مستلزمات هذه الأخوة عطف الغني على الفقير وإشراكه في جزء من ماله، واستتبع ذلك وجود الاديار في النصرانية والتكايا في الإسلام . وكما أنتجت النظم معونة للفقراء وسدا لحاجات المعوزين أنتجت عند بعض الناس تراخيا في العمل، وميلا إلى الكسل واتخاذ الاستجداء حرفة، والتكدي صناعة ، وكثرت جيوش الفقراء فلم تكف النزعات الدينية لسد حاجاتهم، فتدخلت الحكومات حمل بعض العبء فبنت المستشفيات وانشأت الملاجئ وما إلى ذلك . ولعل أهم ما حدث من الانقلاب في تصوّر الإحسان أنه كان يكفي في عده فضيلة أن يخرج الإنسان عن شيء من ماله أو جهده ابتغاء ثواب الله، لا يبالي بعد ذلك أين وقع ماله : أعلى غَنِي أم على فقير، أكان فيه إصلاح للفقير أم إفساد له, فيكفي أن جود بقرش ليحسب له عند الله عشرة أو مئة ، فجاءت الدعوة الحديثة أن ينظر في الإحسان إلى المحسن إليه لا إلى المحسن، فليس من العمل الصالح في شيء أن تعطي حسبما اتفق؛ بل يجب أن يكون عطاؤك لإصلاح مجتمعك ولا يكون ثوابا عند الله إلا إذا نظر فيه هذا النظر، فإذا كان الإحسان يزيد حال الأمة سوءًا عُدّ رذيلة لا فضيلة، ومن أتى به مجرما لا محسنا، لذا تطلب من المحسن أن يشعر بالتبعة والمسؤولية، فمسؤولية المحسن أن يعطي الفقراء ويتساءل هل أفاد من أحسن إليه، وهل فاد الأمة بعمله أو لم يفد ؟";
            examContainer.innerHTML = `
                <div class="mb-6 p-4 bg-gray-50 border-r-4 border-indigo-500 rounded-lg shadow-sm">
                    <p class="text-gray-700 leading-relaxed">${passageText}</p>
                </div>
                <p class="text-sm text-gray-500 mb-2">السؤال ${currentQuestionIndex + 1} من ${examData.length}</p>
                <div class="question-text">${question}</div>
                <div id="options-container">${optionsHtml}</div>
                ${navigationHtml}
            `;
        } else {
            examContainer.innerHTML = `
                <p class="text-sm text-gray-500 mb-2">السؤال ${currentQuestionIndex + 1} من ${examData.length}</p>
                <div class="question-text">${question}</div>
                <div id="options-container">${optionsHtml}</div>
                ${navigationHtml}
            `;
        }


        const optionsContainer = document.getElementById('options-container');
        const nextButton = document.getElementById('next-btn');

        optionsContainer.addEventListener('click', (event) => {
            const target = event.target.closest('.option');
            if (!target || userAnswers[currentQuestionIndex] !== undefined) return;

            const selectedIndex = parseInt(target.dataset.index);
            userAnswers[currentQuestionIndex] = selectedIndex;

            // Highlight selected and correct options
            document.querySelectorAll('.option').forEach(opt => opt.classList.remove('selected'));
            target.classList.add('selected');
            
            if (selectedIndex === questionData.answer) {
                target.classList.add('correct');
            } else {
                target.classList.add('incorrect');
                const correctOption = document.querySelector(`.option[data-index="${questionData.answer}"]`);
                if (correctOption) {
                    correctOption.classList.add('correct');
                }
            }

            nextButton.disabled = false;
        });

        nextButton.addEventListener('click', nextQuestion);
    }

    function nextQuestion() {
        currentQuestionIndex++;
        renderQuestion();
    }

    function prevQuestion() {
        currentQuestionIndex--;
        renderQuestion();
    }

    function renderResults() {
        score = 0;
        let summaryHtml = '';
        examData.forEach((q, index) => {
            const isCorrect = userAnswers[index] === q.answer;
            if (isCorrect) {
                score++;
            }
            const itemClass = isCorrect ? 'summary-item-correct' : 'summary-item-incorrect';
            
            summaryHtml += `
                <li class="summary-item ${itemClass}">
                    <p class="font-bold">السؤال ${index + 1}:</p>
                    <p class="text-lg my-2">${q.question}</p>
                    <p>إجابتك: ${q.options[userAnswers[index]] || 'لم تجب'}</p>
                    ${!isCorrect ? `<p>الإجابة الصحيحة: ${q.options[q.answer]}</p>` : ''}
                </li>
            `;
        });

        examContainer.innerHTML = `
            <div class="results">
                <h2 class="text-3xl font-bold text-gray-800">النتائج</h2>
                <p class="text-2xl mt-4">درجتك: ${score} من ${examData.length}</p>
                <h3 class="text-xl font-bold mt-8 mb-4">مراجعة الإجابات</h3>
                <ul class="summary-list">${summaryHtml}</ul>
                <button class="btn btn-primary mt-4" onclick="location.reload()">إعادة الاختبار</button>
            </div>
        `;
    }

    // Initial render
    document.addEventListener('DOMContentLoaded', () => {
        renderQuestion();
    });
